{% extends "base.html" %}
{% block content %}

<div class="navline">
  <a class="backlink" href="{{ url_for('login') }}">&larr; Volver al login</a>
</div>

<h2 class="h2">Finalizar recuperación de contraseña</h2>

<div class="panel block">
  <div class="note">La nueva contraseña solo debe ser no vacía.</div>
</div>

<form class="panel" method="post" action="{{ url_for('password_recovery_reset') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <div class="block">
    <label class="label">RUT/usuario</label>
    <input class="file" type="text" name="rut" required>
  </div>
  <div class="block">
    <label class="label">ID de solicitud</label>
    <input class="file" type="text" name="request_id" required>
  </div>
  <div class="block">
    <label class="label">Codigo de verificacion entregado por ADMIN</label>
    <input class="file" type="text" name="verification_code" required>
  </div>
  <div class="block">
    <label class="label">Nueva contraseña</label>
    <input class="file" type="password" name="new_password" required autocomplete="new-password">
  </div>
  <div class="block">
    <label class="label">Confirmar nueva contraseña</label>
    <input class="file" type="password" name="confirm_password" required autocomplete="new-password">
  </div>
  <button class="btn" type="submit">Restablecer contraseña</button>
</form>

{% endblock %}
