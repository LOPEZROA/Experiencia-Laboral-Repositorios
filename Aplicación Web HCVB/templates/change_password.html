{% extends "base.html" %}
{% block content %}

<div class="navline">
  <a class="backlink" href="{{ url_for('home') }}">&larr; Volver al inicio</a>
</div>

<h2 class="h2">Cambiar contraseña</h2>

<div class="panel block">
  <div><b>Usuario:</b> {{ current_user }}</div>
  <div class="note">La nueva contraseña solo debe ser no vacía.</div>
</div>

<form class="panel" method="post" action="{{ url_for('change_password') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <div class="block">
    <label class="label">Contraseña actual</label>
    <input class="file" type="password" name="current_password" required autocomplete="current-password">
  </div>
  <div class="block">
    <label class="label">Nueva contraseña</label>
    <input class="file" type="password" name="new_password" required autocomplete="new-password">
  </div>
  <div class="block">
    <label class="label">Confirmar nueva contraseña</label>
    <input class="file" type="password" name="confirm_password" required autocomplete="new-password">
  </div>
  <button class="btn" type="submit">Guardar contraseña</button>
</form>

{% endblock %}
